# Production stack for a single AWS Lightsail instance.
#   cp deploy/.env.production.example deploy/.env.production   (fill it in)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Only Caddy publishes ports (80/443). PostgreSQL, the API and Ollama are reachable only
# on the internal Docker network.
name: knot

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "log_min_duration_statement=500"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  api:
    build: { context: .., dockerfile: server/Dockerfile }
    image: knot-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=10
      APP_ORIGIN: https://${DOMAIN}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  web:
    build: { context: .., dockerfile: web/Dockerfile }
    image: knot-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits: { memory: 128M }
    logging: *logging

  # Optional and NOT recommended on small instances: enable with --profile ai.
  # Prefer a separate GPU/large-RAM host or a hosted API (AI_PROVIDER=openai-compatible).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        limits: { memory: 6G }
    logging: *logging

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:
  ollama:
